name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Run host-side unit tests
        run: |
          set -o pipefail
          pio test -e native 2>&1 | tee native-test.log

      - name: Publish unit-test diagnostics
        if: always()
        run: |
          {
            echo "### Native unit-test output"
            echo '```text'
            cat native-test.log 2>/dev/null || echo "Test log was not created."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build ESP32 firmware
        if: always()
        run: pio run -e impero32
