; PlatformIO Project Configuration File — EasyFSK-PLUS32
;
; ESP32 (Impero32 board / ESP32-WROOM-32U) port of EasyFSK-PLUS
; (https://github.com/ok2zaw/EasyFSK-PLUS), the original AVR/Nano firmware.
; See README.md and the project's design-decisions doc for the full
; architecture and rationale behind the choices below.
;
; https://docs.platformio.org/page/projectconf.html

[env:impero32]
platform = espressif32
board = esp32dev
framework = arduino

; 4MB flash target with an OTA-capable partition scheme + small LittleFS
; partition -- see partitions.csv and the design doc's "Flash size target"
; decision. Works unmodified on 16MB-revision boards too (unused headroom).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 9600
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    bblanchon/ArduinoJson @ ^7
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer

build_flags =
    -D CORE_DEBUG_LEVEL=1
