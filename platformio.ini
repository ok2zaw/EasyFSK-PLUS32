; PlatformIO Project Configuration File — EasyFSK-PLUS32
;
; ESP32 (Impero32 board / ESP32-WROOM-32U) port of EasyFSK-PLUS
; (https://github.com/ok2zaw/EasyFSK-PLUS), the original AVR/Nano firmware.
; See README.md and the project's design-decisions doc for the full
; architecture and rationale behind the choices below.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = impero32

[env:impero32]
; Pinned after the first verified build. Platform 7.1.3 currently ships
; Arduino-ESP32 2.0.17, whose hardware-timer API is used by FskTimer and
; CwTimer. Do not upgrade this independently of those modules.
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino

; 4MB flash target with an OTA-capable partition scheme + small LittleFS
; partition -- see partitions.csv and the design doc's "Flash size target"
; decision. Works unmodified on 16MB-revision boards too (unused headroom).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 9600
upload_speed = 921600

lib_deps =
    marcoschwartz/LiquidCrystal_I2C @ 1.1.4
    bblanchon/ArduinoJson @ 7.4.3
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1

build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:native]
platform = native
test_framework = unity
test_build_src = yes
test_ignore =
    test_winkey
    test_config
    test_config_store
    test_serial_control
build_src_filter =
    +<Baudot.cpp>
    +<Morse.cpp>
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I test/stubs
    -Wall
    -Wextra
    -Werror

[env:native_winkey]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_winkey
build_src_filter =
    +<WinkeyEmulator.cpp>
build_flags =
    -I test/stubs
    -Wall
    -Wextra
    -Werror

[env:native_config]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_config
build_src_filter =
    +<Config.cpp>
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I test/config_stubs
    -Wall
    -Wextra
    -Werror

[env:native_config_store]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_config_store
build_src_filter =
    +<Config.cpp>
    +<ConfigStore.cpp>
    +<WebConfigApi.cpp>
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I test/config_stubs
    -Wall
    -Wextra
    -Werror

[env:native_serial_control]
platform = native
test_framework = unity
test_build_src = yes
test_filter = test_serial_control
build_src_filter =
    +<SerialControl.cpp>
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -I test/serial_control_stubs
    -Wall
    -Wextra
    -Werror
